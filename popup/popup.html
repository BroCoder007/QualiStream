<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Stream Enhancer</title>
</head>
<body>
  <div class="header">
    <span class="logo">⚡</span>
    <span class="title">Stream Quality Enhancer</span>
  </div>

  <div class="status-row">
    <span id="streamStatus" class="badge badge--off">No stream detected</span>
  </div>

  <div class="toggle-row">
    <label class="toggle-label">GPU Enhancement</label>
    <label class="switch">
      <input type="checkbox" id="enhancementToggle" disabled>
      <span class="slider"></span>
    </label>
  </div>

  <div class="info-row" id="gpuInfo">—</div>

  <div class="settings-row">
    <label>Sharpness <span id="sharpVal">1.2</span></label>
    <input type="range" id="sharpness" min="0" max="3" step="0.1" value="1.2">
  </div>

  <div class="settings-row">
    <label>Denoise <span id="denoiseVal">0.3</span></label>
    <input type="range" id="denoise" min="0" max="1" step="0.05" value="0.3">
  </div>

  <div class="footer">
    <a id="optionsLink" href="#">Advanced Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
